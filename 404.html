<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="robots" content="noindex">
  <title>Page introuvable — Arthur Beucher</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0b0c'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23f2f0ed' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23c8a97e'/%3E%3C/svg%3E">
  <style>
    @font-face { font-family: 'Inter'; font-weight: 400; font-display: swap; src: url('/fonts/inter-latin-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Inter Tight'; font-weight: 600; font-display: swap; src: url('/fonts/inter-tight-latin-600-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Instrument Serif'; font-style: italic; font-display: swap; src: url('/fonts/instrument-serif-latin-400-italic.woff2') format('woff2'); }
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; text-align: center; background: #0b0b0c radial-gradient(ellipse 80% 60% at 50% 30%, #1a1a1d, transparent 70%); color: #f2f0ed; font-family: 'Inter', system-ui, sans-serif; }
    .code { font-family: 'Inter Tight', 'Inter', sans-serif; font-weight: 600; font-size: clamp(5rem, 22vw, 11rem); letter-spacing: -.06em; line-height: .9; background: linear-gradient(100deg, #f2f0ed 20%, #6a6864 60%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; font-size: clamp(1.6rem, 4vw, 2.3rem); margin: 14px 0 8px; }
    p { color: #9b9893; margin: 0 0 30px; }
    a { display: inline-flex; align-items: center; gap: 8px; padding: 13px 24px; border-radius: 999px; background: #f2f0ed; color: #0b0b0c; text-decoration: none; font-weight: 500; }
    a:hover { background: #fff; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Cette page s’est perdue dans la brume.</h1>
    <p>Le lien est peut-être incorrect, ou la page a été déplacée.</p>
    <a href="/">← Retour au portfolio</a>
  </main>
</body>
</html>
